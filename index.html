<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency converter</title>
<meta name="description" content="Write 1000 eur to rub and read the answer, at the mid-market rate.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 4v16M7 20l-3-3M17 20V4M17 4l3 3'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/geist-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://api.coinbase.com">

<style>
@font-face {
  font-family: Geist;
  src: url("fonts/geist-sans.woff2") format("woff2");
  font-weight: 100 900;
  font-display: swap;
}

/* Two values, no palette. Nothing is painted: the block's own colour shows
   through, so the embed sits in the page instead of stamping a panel onto it. */
:root {
  --ink: #000;
  --font-sans: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* With no fill of its own, the ink has to follow the host: on a dark page
   black on dark would be invisible, so it inverts to white. */
@media (prefers-color-scheme: dark) {
  :root { --ink: #fff; }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

/* Transparent, not white: the embed shows the host page through its corners
   instead of stamping a panel onto it. */
body {
  background: transparent;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--ink); color: canvas; }

/* The card IS the frame — it fills the block edge to edge, so the border the
   embed shows is this border and there is nothing around it. */
.card {
  min-height: 100%;
  display: grid;
  align-content: start;
  background: transparent;
  border: 1px solid var(--ink);
}

.ask { padding: 16px; }

/* min-width: 0 is load-bearing wherever this input sits in a flex or grid:
   without it the field refuses to shrink past its intrinsic size. */
.query {
  display: block;
  width: 100%;
  min-width: 0;
  border: 0;
  padding: 0;
  background: none;
  color: inherit;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  line-height: 24px;
  font-variant-numeric: tabular-nums;
}
.query::placeholder { color: var(--ink); opacity: 0.4; font-weight: 500; }
.query:focus-visible { outline: none; }
.card:has(.query:focus-visible) { outline: 2px solid var(--ink); outline-offset: -1px; }

/* Every row keeps its height whether or not it has content, so deleting the
   query cannot make the card resize under the cursor. */
.answer {
  padding: 16px;
  border-top: 1px solid var(--ink);
  display: grid;
  gap: 4px;
}

.result {
  min-height: 36px;
  /* An absurd amount must not wrap: the height is a promise, and a truncated
     number would be a wrong number, so it scrolls in place. */
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  font-size: 30px;
  font-weight: 600;
  line-height: 36px;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
/* The currency code steps back by weight, since there is no grey to use. */
.result u { text-decoration: none; font-weight: 400; }
/* An empty answer box reads as broken; an em dash reads as "nothing yet". */
.result:empty::before { content: "—"; opacity: 0.4; }

.note {
  min-height: 20px;
  font-size: 13px;
  line-height: 20px;
  font-variant-numeric: tabular-nums;
  opacity: 0.6;
}
/* No colour left to carry an error, so it carries weight instead. */
.note[data-state="failed"] { opacity: 1; font-weight: 500; }

/* Skeleton repeats the real layout so nothing jumps when the rate lands. */
.note[data-state="loading"] {
  width: 14ch;
  background: var(--ink);
  opacity: 0.1;
  color: transparent;
}

@media (max-width: 420px) {
  .result { font-size: 24px; line-height: 32px; min-height: 32px; letter-spacing: -0.01em; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<main class="card">
  <div class="ask">
    <input class="query" id="query" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-label="What to convert"
           placeholder="1000 eur to rub">
  </div>
  <div class="answer">
    <output class="result" id="result" for="query" aria-live="polite"></output>
    <span class="note" id="note" data-state="loading">Loading the rate</span>
  </div>
</main>

<script type="module">
import {
  CURRENCIES, parseCommand, crossRate, normalizeRates,
  formatAmount, formatRate, formatAge,
} from './convert.js';

const ui = {
  query: document.getElementById('query'),
  result: document.getElementById('result'),
  note: document.getElementById('note'),
};

const LOCALE = navigator.language || 'en-US';
const STORE = 'currency-converter';
const REFRESH_MS = 60_000;

const state = {
  rates: null,       // every currency the feed carries
  at: null,          // when the rates were quoted
  status: 'loading', // loading | ok | failed
};

/* --- rate sources -------------------------------------------------------
   Both are keyless, send Access-Control-Allow-Origin: *, and quote live
   mid-market — the same market Google's converter reports.

   Coinbase leads on measurement, not on reputation: sampled against Google
   Finance it sat within 0.003% on USD/RUB, and it is the only free feed tested
   whose ruble actually moves — fxratesapi returns a pinned 85.12000 that only
   wobbles in the eighth decimal, so it drifts further from the market all day.
   The ruble is the pair where sources genuinely disagree, so it decides the
   order. The fallback is a different company, so one outage cannot take both.

   Both are asked for a USD table and every pair is crossed from it, the way
   Google itself does. Coinbase's own EUR table disagrees with its USD table by
   0.026%, so mixing bases would be worse than crossing. */
const SOURCES = [
  {
    url: 'https://api.coinbase.com/v2/exchange-rates?currency=USD',
    // Coinbase streams continuously but stamps nothing, so the fetch is the time.
    read: (json) => normalizeRates(
      { rates: json?.data?.rates, timestamp: Date.now() / 1000 }, 'USD',
    ),
  },
  {
    url: 'https://api.fxratesapi.com/latest?base=USD',
    read: (json) => normalizeRates(json, 'USD'),
  },
];

async function loadRates() {
  for (const source of SOURCES) {
    try {
      const res = await fetch(source.url, { cache: 'no-store' });
      if (!res.ok) continue;
      const parsed = source.read(await res.json());
      if (!parsed) continue;
      state.rates = parsed.table;
      state.at = parsed.at;
      state.status = 'ok';
      render();
      return;
    } catch {
      // try the next source
    }
  }
  // Keep any rate already on screen — just stop calling it fresh.
  state.status = 'failed';
  render();
}

function render() {
  save();

  if (state.status === 'loading') {
    ui.result.replaceChildren();
    return setNote('loading', 'Loading the rate');
  }
  if (!state.rates) {
    ui.result.replaceChildren();
    return setNote('failed', "Couldn't load the rate. Check your connection.");
  }

  const text = ui.query.value.trim();
  if (!text) {
    ui.result.replaceChildren();
    return setNote('ok', 'Mid-market rate, refreshed every minute');
  }

  const query = parseCommand(text);
  if (!query) {
    ui.result.replaceChildren();
    return setNote('ok', 'Write it as 1000 eur to rub');
  }

  const rate = crossRate(state.rates, query.from, query.to);
  if (rate === null) {
    const missing = state.rates[query.from] ? query.to : query.from;
    ui.result.replaceChildren();
    return setNote('failed', `No rate for ${missing}`);
  }

  // Rounding happens here and nowhere else: the arithmetic above is exact.
  ui.result.replaceChildren(
    document.createTextNode(`${formatAmount(query.amount * rate, LOCALE)} `),
    Object.assign(document.createElement('u'), { textContent: query.to }),
  );

  const pair = `1 ${query.from} ≈ ${formatRate(rate, LOCALE)} ${query.to}`;
  if (state.status === 'failed') {
    const age = formatAge(state.at, Date.now(), 'en');
    return setNote('failed', `${pair} · from ${age}, update failed`);
  }
  setNote('ok', pair);
}

function setNote(status, text) {
  ui.note.dataset.state = status;
  ui.note.textContent = text;
}

function save() {
  try {
    localStorage.setItem(STORE, ui.query.value);
  } catch { /* private mode — the converter still works */ }
}

function restore() {
  try {
    const saved = localStorage.getItem(STORE);
    if (saved) ui.query.value = saved;
  } catch { /* ignore malformed storage */ }
  if (!ui.query.value) ui.query.value = `1000 ${CURRENCIES[0]} to ${CURRENCIES[2]}`.toLowerCase();
}

ui.query.addEventListener('input', render);

// A rate on screen goes stale silently, so refresh while the tab is watched.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadRates();
});
setInterval(() => { if (document.visibilityState === 'visible') loadRates(); }, REFRESH_MS);

restore();
render();
loadRates();
</script>
</body>
</html>
